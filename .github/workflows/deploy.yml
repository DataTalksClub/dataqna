name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: dataqna-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: prints the OIDC claims IAM is matching against, never the
      # token itself. Remove once the trust policy is confirmed.
      - name: Show OIDC claims
        run: |
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2)
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          printf '%s%*s' "$payload" "$pad" '' | tr ' ' '=' | tr '_-' '/+' \
            | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, workflow_ref, event_name}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::817685572750:role/dataqna-github-actions-deploy
          aws-region: eu-west-1

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: sam build --config-env sandbox

      - name: Deploy
        run: sam deploy --config-env sandbox --no-confirm-changeset --no-fail-on-empty-changeset

      # Fails the workflow if the deployed site is not actually working, rather
      # than reporting success because CloudFormation returned CREATE_COMPLETE.
      - name: Verify the deployment
        run: uv run python scripts/verify_deployment.py --base-url https://qna.dtcdev.click
        env:
          DATAQNA_KEY: ${{ secrets.DATAQNA_VERIFY_KEY }}
