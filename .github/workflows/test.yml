name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The vendored dakit checkers (lock, borders, colors, scale) run under
      # pytest and skip without node, so pin one rather than rely on the image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate template
        run: sam validate --lint --region eu-west-1
