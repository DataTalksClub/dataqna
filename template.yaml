AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DataQnA — audience Q&A for live events, podcasts, and courses

Parameters:
  DomainName:
    Type: String
    Default: qna.dtcdev.click
  DomainCertificateArn:
    Type: String
  HostedZoneId:
    Type: String
    Default: Z05963572WVWFHDQZH5NE
  AuthBaseUrl:
    Type: String
    Default: https://auth.dtcdev.click
  AuthClientId:
    Type: String
  AuthIssuer:
    Type: String
  AuthJwksUrl:
    Type: String
  RootAdmin:
    Type: String
    Default: alexey@datatalks.club
    Description: Bootstrap owner, admin of every room so a fresh stack is reachable.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        SITE_URL: !Sub https://${DomainName}
        SESSION_SECRET_ARN: !Ref SessionSecret
        ROOT_ADMIN: !Ref RootAdmin
        AUTH_BASE_URL: !Ref AuthBaseUrl
        AUTH_CLIENT_ID: !Ref AuthClientId
        AUTH_ISSUER: !Ref AuthIssuer
        AUTH_JWKS_URL: !Ref AuthJwksUrl
        AUTH_CALLBACK_URL: !Sub https://${DomainName}/auth/callback

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref DomainCertificateArn
        EndpointConfiguration: REGIONAL
        Route53:
          HostedZoneId: !Ref HostedZoneId
          EvaluateTargetHealth: false

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/session
      Description: HMAC key for DataQnA session and participant cookies
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: signing_secret
        PasswordLength: 64
        ExcludePunctuation: true

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref AWS::StackName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  PublicFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: public_handler.lambda_handler
      Description: Room pages, QR codes, assets, and the REST API
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref SessionSecret
      Events:
        Root:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /, Method: GET}
        Live:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /live, Method: GET}
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /health, Method: GET}
        Assets:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/assets/{proxy+}', Method: GET}
        Rooms:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/r/{proxy+}', Method: ANY}
        Api:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/v1/{proxy+}', Method: ANY}

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: admin_handler.lambda_handler
      Description: Admin console, presentation mode, and the Cognito login flow
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref SessionSecret
      Events:
        Admin:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /admin, Method: GET}
        AdminProxy:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/admin/{proxy+}', Method: GET}
        Auth:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/auth/{proxy+}', Method: GET}

  PublicErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: DataQnA public function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref PublicFunction

  AdminErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: DataQnA admin function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdminFunction

Outputs:
  SiteUrl:
    Description: Public site.
    Value: !Sub https://${DomainName}
  AdminUrl:
    Description: Admin console.
    Value: !Sub https://${DomainName}/admin
  ApiBaseUrl:
    Description: REST API base URL.
    Value: !Sub https://${DomainName}/api/v1
  TableName:
    Value: !Ref Table
  ApiEndpoint:
    Description: Default execute-api endpoint, for debugging before DNS settles.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
