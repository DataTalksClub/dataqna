<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="Ask and upvote questions — live.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1220" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{FAVICON}}">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="wrap">
  <header class="room">
    <h1>{{TITLE}}</h1>
    <p id="description">{{DESCRIPTION}}</p>
    <div class="live-count" id="live-count" hidden></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <form id="ask" class="card stack" hidden>
    <textarea id="text" maxlength="500" enterkeyhint="send"
              placeholder="Ask a question…" aria-label="Your question"></textarea>
    <div class="counter" id="counter" hidden><span id="count">0</span>/<span id="max">500</span></div>
    <div class="row wrapping">
      <input type="text" id="name" class="grow" maxlength="60" autocomplete="name"
             placeholder="Your name (optional)" aria-label="Your name">
      <button type="submit" id="send">Send</button>
    </div>
  </form>

  <div class="tabs">
    <button type="button" id="tab-popular" aria-pressed="true">Popular</button>
    <button type="button" id="tab-recent" aria-pressed="false">Recent</button>
    <button type="button" id="tab-answered" aria-pressed="false" hidden>Answered</button>
  </div>

  <ul class="questions" id="list"></ul>

  <div class="empty" id="empty" hidden>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <h2 id="empty-title">No questions yet</h2>
    <p id="empty-body">Ask the first one — it only takes a moment.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="config" type="application/json">{{CONFIG}}</script>
<script src="/assets/room.js"></script>
</body>
</html>
