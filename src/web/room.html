<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="Ask and upvote questions — live.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#5951e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2438" media="(prefers-color-scheme: dark)">
<script>
/* Apply a pinned theme before first paint, so there is no flash. */
(function () {
  try {
    var t = localStorage.getItem("dq_theme");
    if (t !== "light" && t !== "dark") return;
    document.documentElement.classList.add("theme-" + t);
    var c = t === "dark" ? "#1d2438" : "#5951e8";
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", c);
  } catch (e) {}
})();
</script>
<link rel="icon" href="{{FAVICON}}">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <span class="hero-kicker"><span class="dot" aria-hidden="true"></span>Live Q&amp;A</span>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch to dark theme"></button>
    </div>
    <h1>{{TITLE}}</h1>
    <p class="desc" id="description">{{DESCRIPTION}}</p>
    <div class="live-count" id="live-count" hidden></div>
  </div>
</header>

<div class="wrap room-wrap">
  <form id="ask" class="composer" hidden>
    <textarea id="text" rows="2" enterkeyhint="send"
              placeholder="Type your question…" aria-label="Your question"></textarea>
    <div class="composer-foot">
      <input type="text" id="name" maxlength="60" autocomplete="name"
             placeholder="Your name (optional)" aria-label="Your name">
      <div class="limit-ring" id="limit" aria-hidden="true">
        <svg viewBox="0 0 28 28">
          <circle class="track" cx="14" cy="14" r="12"></circle>
          <circle class="fill" cx="14" cy="14" r="12"></circle>
        </svg>
        <span class="left" id="limit-left"></span>
      </div>
      <button type="submit" id="send">Send</button>
    </div>
  </form>
  <div class="sr-only" id="limit-live" aria-live="polite"></div>

  <div id="banner" class="banner" hidden></div>

  <div class="tabs">
    <button type="button" id="tab-popular" aria-pressed="true">Popular</button>
    <button type="button" id="tab-recent" aria-pressed="false">Recent</button>
    <button type="button" id="tab-answered" aria-pressed="false" hidden>Answered</button>
  </div>

  <ul class="questions" id="list"></ul>

  <div class="empty" id="empty" hidden>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <h2 id="empty-title">No questions yet</h2>
    <p id="empty-body">Ask the first one — it only takes a moment.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="config" type="application/json">{{CONFIG}}</script>
<script src="/assets/room.js"></script>
</body>
</html>
