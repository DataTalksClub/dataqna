<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{FAVICON}}">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="present">
<div class="present-shell">
  <header class="present-bar">
    <div class="session" id="session-title"></div>
    <div class="join">
      <div class="qr" id="qr"></div>
      <div>
        <div class="join-label">Join and ask</div>
        <div class="url" id="join-url"></div>
      </div>
    </div>
  </header>

  <div class="present-body">
    <main class="present-stage" id="stage">
      <div class="q-text" id="q-text">No questions yet.</div>
      <div class="q-meta" id="q-meta"></div>
    </main>

    <aside class="present-queue">
      <h2>Up next</h2>
      <ul id="upcoming"></ul>
      <div class="queue-empty" id="queue-empty" hidden>Nothing waiting.</div>
    </aside>
  </div>

  <footer class="present-foot">
    <span class="progress" id="progress"></span>
    <span class="hints" id="hints">
      → next · ← back · Enter answered · p pin · h hide · u undo · q QR · f fullscreen · Esc exit
    </span>
  </footer>
</div>

<div class="present-cue" id="cue"></div>

<div class="present-overlay" id="overlay">
  <div class="qr" id="qr-big"></div>
  <div class="url" id="overlay-url"></div>
  <div class="code" id="overlay-code"></div>
</div>

<script id="config" type="application/json">{{CONFIG}}</script>
<script src="/assets/present.js"></script>
</body>
</html>
